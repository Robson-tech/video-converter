# prometheus/prometheus.yaml - CORRIGIDO
global:
  scrape_interval: 10s
scrape_configs:
    - job_name: 'prometheus'
      static_configs:
        - targets:
          - prometheus:9090
    - job_name: video-converter
      static_configs:
        - targets:
          # Use host.docker.internal para alcançar sua máquina host a partir do contêiner
          # e use a porta 5000, que é a porta que a aplicação Flask está usando.
          - host.docker.internal:52455
    - job_name: 'kubernetes-pods'
      kubernetes_sd_configs:
        - role: pod
          api_server: 'http://http://127.0.0.1:52455/metrics'
          # Desabilitar a verificação TLS é necessário para ambientes de teste como Minikube
          tls_config:
            insecure_skip_verify: true
      relabel_configs:
        # Esta seção filtra apenas os pods que têm a anotação 'prometheus.io/scrape: true'
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
          action: keep
          regex: true
        # Configura o caminho do endpoint de métricas
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
          action: replace
          target_label: __metrics_path__
          regex: (.+)
        # Configura a porta e o endereço
        - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
          action: replace
          regex: ([^:]+)(?::\d+)?;(\d+)
          replacement: $1:$2
          target_label: __address__