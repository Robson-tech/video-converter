apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-converter
  labels:
    app: video-converter
spec:
  replicas: 2
  selector:
    matchLabels:
      app: video-converter
  template:
    metadata:
      labels:
        app: video-converter
    spec:
      containers:
      - name: video-converter
        image: video-converter:latest
        ports:
        - containerPort: 5000
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: video-converter-service
spec:
  selector:
    app: video-converter
  ports:
  - port: 80
    targetPort: 5000
  type: LoadBalancer